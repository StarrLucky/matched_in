# SonarQube / SonarCloud analysis. Run it with `make sonar`.
#
# The scanner needs a server to report to:
#   SONAR_HOST_URL=https://sonarcloud.io  SONAR_TOKEN=…  make sonar
# For SonarCloud, uncomment sonar.organization below and use your own key.

sonar.projectKey=StarrLucky_matched_in
sonar.projectName=matched_in
sonar.projectVersion=1.0.0

# SonarCloud requires an organisation, which `make sonar` passes from
# SONAR_ORGANIZATION. Uncomment this to pin it here instead.
# sonar.organization=your-sonarcloud-org

sonar.sources=server,public,scripts
sonar.tests=test
sonar.sourceEncoding=UTF-8

# data/ holds the Chrome profile and the swipe history; docs/ is screenshots.
sonar.exclusions=data/**,docs/**,coverage/**,node_modules/**

# `make coverage` writes this. It comes from the unit suite: the end-to-end
# tests drive the server as a separate process, which no coverage run sees.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
